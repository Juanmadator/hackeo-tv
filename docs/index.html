<script>
(function () {
  /* PC opcional (si está encendido, abre también Prime, Disney+, etc.). Sin PC, la página se basta para YouTube/Netflix. */
  var PC = (location.host === '192.168.1.38:8765') ? '' : 'http://192.168.1.38:8765';
  var API = PC;
  /* IP de la tele: se descubre sola (la tele responde a /nrc/ddd.xml) y se recuerda. */
  var TV_IP = null;
  try { TV_IP = localStorage.getItem('tv_ip'); } catch (e) {}
  function fijarTV(ip) { TV_IP = ip; try { localStorage.setItem('tv_ip', ip); } catch (e) {}
    document.getElementById('dial_youtube').action = 'http://' + ip + ':55000/nrc/dial/YouTube';
    document.getElementById('dial_netflix').action = 'http://' + ip + ':55000/nrc/dial/Netflix'; }
  function probarTV(ip, cb) { try { var x = new XMLHttpRequest(); x.open('GET', 'http://' + ip + ':55000/nrc/ddd.xml', true); x.timeout = 1500;
    x.onreadystatechange = function () { if (x.readyState === 4) cb(x.status === 200 && /Panasonic/.test(x.responseText || '')); };
    x.onerror = function () { cb(false); }; x.ontimeout = function () { cb(false); }; x.send(null); } catch (e) { cb(false); } }
  function buscarTV() {
    var candidatos = [];
    if (TV_IP) candidatos.push(TV_IP);
    candidatos.push('192.168.1.139');
    var m = /^(\d+\.\d+\.\d+)\./.exec(location.hostname);
    var base = m ? m[1] : '192.168.1';
    for (var i = 2; i < 255; i++) { var c = base + '.' + i; if (c !== TV_IP && c !== '192.168.1.139') candidatos.push(c); }
    var k = 0, encontrada = false, activos = 0;
    function siguiente() {
      while (activos < 6 && k < candidatos.length && !encontrada) { (function (ip) { activos++;
        probarTV(ip, function (ok) { activos--; if (ok && !encontrada) { encontrada = true; fijarTV(ip); } else if (!encontrada) siguiente(); }); })(candidatos[k++]); }
    }
    siguiente();
  }
  if (TV_IP) fijarTV(TV_IP); else fijarTV('192.168.1.139');
  buscarTV();
  if (/fondo=fotos/.test(location.search)) document.body.className = 'fotos';
  var filas = [ document.getElementById('apps').getElementsByTagName('a'), document.getElementById('barra').getElementsByTagName('a') ];

  };
  function dos(n) { return (n < 10 ? '0' : '') + n; }
  function franja(h) { return h < 6 ? 'noche' : h < 14 ? 'manana' : h < 21 ? 'tarde' : 'noche'; }
  var fraseActual = null, franjaActual = null;
  function reloj() {
    var d = new Date(), h = d.getHours();
    document.getElementById('hora').innerHTML = dos(h) + ':' + dos(d.getMinutes());
    var f = dias[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()];
    document.getElementById('fecha').innerHTML = f.charAt(0).toUpperCase() + f.slice(1);
    var fr = franja(h);
    if (fr !== franjaActual) { franjaActual = fr; var l = frases[fr]; fraseActual = l[Math.floor(Math.random() * l.length)]; document.getElementById('saludo').innerHTML = fraseActual; }
  }

  var fotos = document.getElementById('fotos').getElementsByClassName('foto'), fi = 0;
  function siguienteFoto() { for (var k = 0; k < fotos.length; k++) fotos[k].className = 'foto'; fotos[fi].className = 'foto on'; fi = (fi + 1) % fotos.length; }
  if (document.body.className === 'fotos') { siguienteFoto(); setInterval(siguienteFoto, 24000); }

  function marcar(nf, nc) {
    for (var r = 0; r < filas.length; r++) for (var k = 0; k < filas[r].length; k++) filas[r][k].className = filas[r][k].className.replace(' sel', '');
    fila = (nf + filas.length) % filas.length;
    col = Math.max(0, Math.min(nc, filas[fila].length - 1));
    var el = filas[fila][col]; el.className += ' sel';
    try { el.focus(); } catch (e) {}
  }
  function aviso(t, on) { var a = document.getElementById('aviso'); a.getElementsByTagName('span')[0].innerHTML = t; a.className = 'aviso' + (on ? ' on' : ''); }
  function pedir(ruta, texto) {
    if (lanzando) return; lanzando = true;
    aviso(texto, true);
    var x = new XMLHttpRequest();
    x.open('GET', API + ruta + '&t=' + new Date().getTime(), true);
    x.timeout = 2500; x.ontimeout = function () { x.onerror(); };
    x.onreadystatechange = function () { if (x.readyState === 4) { if (x.status !== 200) { x.onerror(); return; } setTimeout(function () { lanzando = false; aviso('', false); }, 3500); } };
    x.onerror = function () { aviso('Esta app se abre con el botón APPS del mando', true); setTimeout(function () { lanzando = false; aviso('', false); }, 3500); };
    try { x.send(); } catch (e) { x.onerror(); }
  }
  var DIAL = { youtube: 'dial_youtube', netflix: 'dial_netflix' };
  function pantallaCompleta() { try { if (!document.mozFullScreenElement) document.documentElement.mozRequestFullScreen(); } catch (e) {} }
  var capa = document.getElementById('capa');
  capa.onclick = function () { pantallaCompleta(); capa.style.display = 'none'; marcar(0, 0); return false; };
  function abrir(el) {
    var app = el.getAttribute('data-app'), tecla = el.getAttribute('data-tecla');
    if (app && DIAL[app]) { aviso('Abriendo ' + nombres[app] + '…', true); try { document.getElementById(DIAL[app]).submit(); } catch (e) {} setTimeout(function () { aviso('', false); }, 4000); return; }
    if (app) pedir('/api/app?n=' + app, 'Abriendo ' + (nombres[app] || app) + '…');
    else if (tecla) pedir('/api/tecla?k=' + tecla, tecla === 'POWER' ? 'Apagando…' : 'Un momento…');
  }
  for (var r = 0; r < filas.length; r++) for (var i = 0; i < filas[r].length; i++) (function (r, i) {
    var el = filas[r][i];
    el.onclick = function (e) { if (e && e.preventDefault) e.preventDefault(); marcar(r, i); abrir(el); return false; };
    el.onmouseover = function () { marcar(r, i); };
    el.onfocus = function () { marcar(r, i); };
  })(r, i);
  document.onkeydown = function (e) {
    e = e || window.event; var c = e.keyCode;
    if (c === 37) marcar(fila, col - 1);
    else if (c === 39) marcar(fila, col + 1);
    else if (c === 38) marcar(fila - 1, col);
    else if (c === 40) marcar(fila + 1, col);
    else if (c === 13) abrir(filas[fila][col]);
    else return true;
    if (e.preventDefault) e.preventDefault(); return false;
  };
  reloj(); setInterval(reloj, 1000); marcar(0, 0);
})();
</script>
